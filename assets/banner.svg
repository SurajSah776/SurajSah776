<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#334155" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.5;0.3" dur="8s" repeatCount="indefinite" />
      </circle>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="250" fill="url(#bg-gradient)" rx="12" ry="12" />
  <rect width="800" height="250" fill="url(#grid)" rx="12" ry="12" />

  <!-- Animated Abstract Nodes - Right Side -->
  <g filter="url(#glow)">
    <circle cx="680" cy="80" r="6" fill="#22d3ee" opacity="0.8">
      <animate attributeName="cy" values="80;70;80" dur="4s" repeatCount="indefinite" />
      <animate attributeName="cx" values="680;685;680" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="730" cy="130" r="4" fill="#818cf8" opacity="0.8">
      <animate attributeName="cy" values="130;140;130" dur="5s" repeatCount="indefinite" />
      <animate attributeName="cx" values="730;725;730" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="700" cy="180" r="5" fill="#22d3ee" opacity="0.6">
      <animate attributeName="cy" values="180;170;180" dur="6s" repeatCount="indefinite" />
      <animate attributeName="cx" values="700;705;700" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="650" cy="150" r="3" fill="#818cf8" opacity="0.5">
      <animate attributeName="cy" values="150;145;150" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="cx" values="650;655;650" dur="6.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="760" cy="90" r="3.5" fill="#22d3ee" opacity="0.4">
      <animate attributeName="cy" values="90;95;90" dur="5.5s" repeatCount="indefinite" />
    </circle>

    <line x1="680" y1="80" x2="730" y2="130" stroke="url(#accent)" stroke-width="1.5" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="730" y1="130" x2="700" y2="180" stroke="url(#accent)" stroke-width="1.5" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="5s" repeatCount="indefinite" />
    </line>
    <line x1="680" y1="80" x2="700" y2="180" stroke="url(#accent)" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="6s" repeatCount="indefinite" />
    </line>
    <line x1="650" y1="150" x2="680" y2="80" stroke="url(#accent)" stroke-width="1" opacity="0.3" />
    <line x1="650" y1="150" x2="730" y2="130" stroke="url(#accent)" stroke-width="1" opacity="0.3" />
    <line x1="700" y1="180" x2="760" y2="90" stroke="url(#accent)" stroke-width="1" opacity="0.25" />
  </g>

  <!-- Subtle glow background effect -->
  <circle cx="680" cy="130" r="80" fill="#22d3ee" opacity="0.08" filter="url(#glow-strong)">
    <animate attributeName="opacity" values="0.08;0.12;0.08" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Text with fade-in animation -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze" />

    <text x="60" y="110" font-family="'Inter', 'Segoe UI', sans-serif" font-size="44"
      font-weight="800" fill="#F8FAFC" letter-spacing="-1">
      Suraj Kumar Sah
    </text>

    <text x="60" y="155" font-family="'Inter', 'Segoe UI', sans-serif" font-size="18"
      font-weight="600" fill="url(#accent)" letter-spacing="0.5">
      GenAI Architect &amp; Full-Stack Engineer
    </text>

    <text x="60" y="195" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" fill="#94A3B8"
      letter-spacing="0.5">
      Orchestrating stateful agents • Engineering production RAG • Building high-throughput APIs
    </text>

    <!-- Animated accent line -->
    <rect x="60" y="220" width="0" height="4" rx="2" fill="url(#accent)">
      <animate attributeName="width" from="0" to="120" dur="1s" fill="freeze" begin="0.5s" />
    </rect>
  </g>
</svg>